<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NuClone Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #820AD1; color: white; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phone { background: #fff; color: black; width: 360px; height: 720px; border-radius: 30px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        
        .header { background: #820AD1; padding: 25px; color: white; }
        .user-icon { background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        
        /* CARD */
        .card-area { padding: 20px; border-bottom: 1px solid #f0f0f0; }
        .bal-val { font-size: 24px; font-weight: bold; margin-top: 5px; }
        
        /* ACTIONS */
        .actions-row { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; }
        .act-btn { text-align: center; width: 70px; flex-shrink: 0; }
        .act-icon { background: #eee; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; font-size: 20px; }
        
        /* LOAN CARD */
        .loan-card { margin: 20px; padding: 20px; background: #f0f0f0; border-radius: 10px; }
        
        /* INPUTS */
        .nu-inp { width: 100%; padding: 15px; border: none; border-bottom: 1px solid #ccc; outline: none; font-size: 18px; margin-bottom: 20px; }
        .nu-btn { background: #820AD1; color: white; width: 100%; padding: 15px; border-radius: 30px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* SUCCESS ANIMATION */
        .success-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: #2ecc71; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .checkmark { font-size: 80px; animation: pop 0.5s; }
        @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="phone">
        
        <div class="success-overlay" id="success-screen">
            <i class="fas fa-check-circle checkmark"></i>
            <h2 style="margin-top:20px;">Enviado!</h2>
        </div>

        <div id="v-auth" class="view active" style="padding:40px; justify-content:center;">
            <h2 style="color:#820AD1;">NuClone</h2>
            <input id="reg-name" class="nu-inp" placeholder="Nome Completo">
            <input id="reg-cpf" class="nu-inp" placeholder="CPF">
            <input id="reg-pass" class="nu-inp" type="password" placeholder="Senha (4 números)" maxlength="4">
            <button class="nu-btn" onclick="registerBank()">ENTRAR</button>
        </div>

        <div id="v-home" class="view">
            <div class="header">
                <div class="user-icon"><i class="fas fa-user"></i></div>
                <div style="font-weight:bold;">Olá, <span id="u-name">...</span></div>
            </div>
            
            <div class="card-area">
                <div style="font-size:14px; font-weight:bold;">Conta</div>
                <div class="bal-val">R$ <span id="u-bal">0,00</span></div>
            </div>

            <div class="actions-row">
                <div class="act-btn" onclick="goto('pix')"><div class="act-icon"><i class="fas fa-brands fa-pix"></i></div><small>Área Pix</small></div>
                <div class="act-btn"><div class="act-icon"><i class="fas fa-barcode"></i></div><small>Pagar</small></div>
                <div class="act-btn" onclick="goto('loan')"><div class="act-icon"><i class="fas fa-hand-holding-usd"></i></div><small>Empréstimo</small></div>
                <div class="act-btn"><div class="act-icon"><i class="fas fa-mobile-alt"></i></div><small>Recarga</small></div>
            </div>

            <div class="loan-card">
                <span style="font-size:14px;">Cartão de Crédito</span>
                <div style="font-size:18px; font-weight:bold; margin-top:5px;">Fatura Atual: R$ 0,00</div>
                <div style="font-size:12px; color:#666;">Limite disponível: R$ 50,00</div>
            </div>
        </div>

        <div id="v-pix" class="view" style="padding:20px;">
            <h3 style="color:#820AD1;">Área Pix</h3>
            <input id="pix-key" class="nu-inp" placeholder="Chave Aleatória ou Copia e Cola">
            <button class="nu-btn" onclick="validatePix()">CONTINUAR</button>
            <p style="text-align:center; margin-top:20px; cursor:pointer;" onclick="goto('home')">Voltar</p>
        </div>

        <div id="v-loan" class="view" style="padding:20px;">
            <h3 style="color:#820AD1;">Empréstimo</h3>
            <p>Valor disponível para você:</p>
            <h1 style="color:#333;">R$ <span id="loan-available">0,00</span></h1>
            <button class="nu-btn" onclick="takeLoan()">CONTRATAR AGORA</button>
            <p style="text-align:center; margin-top:20px; cursor:pointer;" onclick="goto('home')">Voltar</p>
        </div>

    </div>

    <script>
        const DB_KEY = 'cine_v21_system';
        let currentUser = null;

        function getDB() { return JSON.parse(localStorage.getItem(DB_KEY)) || {users:[], transactions:[]}; }
        function saveDB(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); }

        window.onload = () => {
            const s = JSON.parse(localStorage.getItem('cineSession'));
            if(!s) { alert("Faça login no Site primeiro."); return; }
            const db = getDB();
            currentUser = db.users.find(u => u.email === s.email);
            if(currentUser.name !== 'Usuário') { updateUI(); goto('home'); }
        };

        function goto(v) {
            document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
            document.getElementById('v-'+v).classList.add('active');
            if(v==='loan') document.getElementById('loan-available').innerText = currentUser.loan_limit.toFixed(2);
        }

        function registerBank() {
            const n = document.getElementById('reg-name').value;
            const c = document.getElementById('reg-cpf').value;
            if(n && c) {
                const db = getDB();
                const i = db.users.findIndex(u => u.email === currentUser.email);
                db.users[i].name = n; db.users[i].cpf = c;
                saveDB(db); currentUser = db.users[i];
                updateUI(); goto('home');
            }
        }

        function updateUI() {
            document.getElementById('u-name').innerText = currentUser.name.split(' ')[0];
            document.getElementById('u-bal').innerText = currentUser.balance.toFixed(2);
        }

        function validatePix() {
            const k = document.getElementById('pix-key').value;
            
            // GERA DESTINO ALEATÓRIO SE NÃO FOR DO CINESTREAM
            let dest = "Desconhecido";
            let val = 0;
            let type = "out";

            if(k.startsWith("CINESTREAM")) {
                dest = "CineStream Premium";
                val = parseFloat(k.split('_')[2]);
                type = "service";
            } else {
                // Pagamento Aleatório (Simulação)
                const randoms = ["Mercado Livre", "Uber", "Ifood", "João Silva", "Padaria Estrela"];
                dest = randoms[Math.floor(Math.random() * randoms.length)];
                val = Math.floor(Math.random() * 50) + 10; // R$ 10 a 60
                if(confirm(`Transferir R$ ${val.toFixed(2)} para ${dest}?`)) {
                    processPix(val, dest, type, null);
                }
                return;
            }

            if(currentUser.balance >= val) {
                processPix(val, dest, type, k.split('_')[1].toLowerCase());
            } else alert("Saldo insuficiente.");
        }

        function processPix(val, dest, type, plan) {
            const db = getDB();
            const i = db.users.findIndex(u => u.email === currentUser.email);
            
            db.users[i].balance -= val;
            if(type === 'service') db.users[i].plan = plan; // Ativa plano se for CineStream
            
            // LOG NO ADMIN
            db.transactions.push({ from: currentUser.email, to: dest, val: val, date: new Date().toLocaleDateString(), status: 'paid' });
            
            saveDB(db); currentUser = db.users[i];
            
            // ANIMAÇÃO
            const s = document.getElementById('success-screen');
            s.style.display = 'flex';
            setTimeout(() => { s.style.display='none'; updateUI(); goto('home'); }, 2000);
        }

        function takeLoan() {
            if(currentUser.loan_limit > 0) {
                const db = getDB();
                const i = db.users.findIndex(u => u.email === currentUser.email);
                db.users[i].balance += currentUser.loan_limit;
                db.users[i].loan_taken += currentUser.loan_limit;
                db.users[i].loan_limit = 0; // Zerar limite
                saveDB(db); currentUser = db.users[i];
                alert("Empréstimo contratado!"); updateUI(); goto('home');
            } else alert("Você não tem limite aprovado.");
        }
    </script>
</body>
</html>
