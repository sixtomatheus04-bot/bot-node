<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NuClone</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #820AD1; color: white; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phone { background: #fff; color: black; width: 350px; height: 650px; border-radius: 30px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        
        .inp { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 16px; }
        .btn-nu { background: #820AD1; color: white; border: none; padding: 15px; border-radius: 30px; font-weight: bold; width: 100%; cursor: pointer; }
        
        h2 { color: #820AD1; margin-bottom: 5px; }
        .bal { font-size: 28px; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="phone">
        
        <div id="v-login" class="view active" style="justify-content:center;">
            <h2>Olá, NuClone</h2>
            <p style="color:#666; margin-bottom:20px;">Complete seu cadastro bancário.</p>
            <input id="reg-name" class="inp" placeholder="Nome Completo">
            <input id="reg-cpf" class="inp" placeholder="CPF">
            <input id="reg-pin" class="inp" type="password" placeholder="Senha (4 números)" maxlength="4">
            <button class="btn-nu" onclick="createBank()">ACESSAR CONTA</button>
        </div>

        <div id="v-home" class="view">
            <div style="background:#820AD1; color:white; padding:20px; margin:-20px -20px 20px -20px;">
                <span id="user-name">Olá</span>
            </div>
            <p style="color:#666;">Saldo disponível</p>
            <div class="bal">R$ <span id="balance">0.00</span></div>
            <div style="display:flex; gap:10px; overflow-x:auto; padding:10px 0;">
                <div style="background:#f0f0f0; width:80px; height:80px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="goto('pix')">Pix</div>
            </div>
        </div>

        <div id="v-pix" class="view">
            <h2>Área Pix</h2>
            <p>Pagar Código:</p>
            <input id="pix-key" class="inp" placeholder="Cola aqui...">
            <button class="btn-nu" onclick="pay()">PAGAR</button>
            <p style="text-align:center; color:#820AD1; margin-top:20px; cursor:pointer;" onclick="goto('home')">Voltar</p>
        </div>

    </div>

    <script>
        const DB_KEY = 'cine_v19_ecosystem';
        let currentUser = null;

        function getDB() { return JSON.parse(localStorage.getItem(DB_KEY)) || []; }
        function saveDB(d) { localStorage.setItem(DB_KEY, JSON.stringify(d)); }

        window.onload = () => {
            const s = JSON.parse(localStorage.getItem('cineSession'));
            if(!s) { alert("Entre no CineStream primeiro!"); return; }
            
            const db = getDB();
            currentUser = db.find(u => u.email === s.email);
            
            if(currentUser.name && currentUser.name !== 'Usuário') {
                updateUI(); goto('home');
            }
        };

        function createBank() {
            const n = document.getElementById('reg-name').value;
            const c = document.getElementById('reg-cpf').value;
            const p = document.getElementById('reg-pin').value;
            
            if(n && c && p.length===4) {
                const db = getDB();
                const i = db.findIndex(u => u.email === currentUser.email);
                db[i].name = n; db[i].cpf = c; db[i].pin = p;
                saveDB(db); currentUser = db[i];
                updateUI(); goto('home');
            } else alert("Preencha tudo");
        }

        function updateUI() {
            document.getElementById('user-name').innerText = "Olá, " + currentUser.name;
            document.getElementById('balance').innerText = currentUser.balance.toFixed(2);
        }

        function goto(v) {
            document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
            document.getElementById('v-'+v).classList.add('active');
        }

        function pay() {
            const k = document.getElementById('pix-key').value;
            if(!k.includes('CINESTREAM')) return alert("Código Inválido");
            
            // CINESTREAM_PREMIUM_29.90
            const val = parseFloat(k.split('_')[2]);
            const plan = k.split('_')[1].toLowerCase();

            if(currentUser.balance >= val) {
                const db = getDB();
                const i = db.findIndex(u => u.email === currentUser.email);
                
                db[i].balance -= val;
                db[i].plan = plan; // ATIVA NO SITE
                
                saveDB(db); currentUser = db[i];
                alert("PAGAMENTO REALIZADO! Plano Ativado.");
                updateUI(); goto('home');
            } else alert("Saldo insuficiente. Peça ao Admin.");
        }
    </script>
</body>
</html>
