<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream Ultra</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #E50914;
            --dark: #141414;
            --gray: #AAA;
            --gradient: linear-gradient(to top, #141414 10%, transparent 90%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- ANIMAÇÕES (KEYFRAMES) --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomSlow { from { transform: scale(1); } to { transform: scale(1.15); } }
        @keyframes glow { 0% { box-shadow: 0 0 5px var(--primary); } 50% { box-shadow: 0 0 20px var(--primary); } 100% { box-shadow: 0 0 5px var(--primary); } }

        /* --- NAVBAR BLUR --- */
        .nav {
            position: fixed; top: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4%; z-index: 50;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px); /* Efeito de vidro fosco */
            transition: 0.3s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-family: 'Bebas Neue', cursive; color: var(--primary); font-size: 32px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(229,9,20,0.5); cursor: pointer; }
        
        .search-bar { position: relative; }
        .search-bar input {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px; border-radius: 20px; color: white; outline: none;
            transition: 0.3s; width: 200px;
        }
        .search-bar input:focus { width: 300px; border-color: var(--primary); background: rgba(0,0,0,0.8); }

        /* --- BANNER HERO (CINEMATOGRÁFICO) --- */
        .hero {
            position: relative; height: 85vh; width: 100%;
            overflow: hidden;
        }
        .hero-bg {
            width: 100%; height: 100%; object-fit: cover;
            animation: zoomSlow 20s infinite alternate; /* Imagem se mexe sozinha */
        }
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, #141414 0%, rgba(20,20,20,0.6) 50%, transparent 100%),
                        linear-gradient(0deg, #141414 0%, transparent 50%);
        }
        .hero-content {
            position: absolute; top: 30%; left: 4%; max-width: 600px;
            animation: fadeIn 1s ease-out;
        }
        .hero-title {
            font-family: 'Bebas Neue', sans-serif; font-size: 5rem; line-height: 0.9;
            margin-bottom: 20px; text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .hero-desc {
            font-size: 1.1rem; color: #ddd; margin-bottom: 30px; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        .btn {
            padding: 12px 30px; font-weight: 600; border: none; border-radius: 5px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
            transition: 0.3s; font-size: 1rem;
        }
        .btn-play { background: white; color: black; }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
        .btn-info { background: rgba(109, 109, 109, 0.7); color: white; margin-left: 10px; }
        .btn-info:hover { background: rgba(109, 109, 109, 0.4); }

        /* --- LISTAS DE FILMES --- */
        .category { margin: 20px 0 40px 20px; animation: fadeIn 1.5s ease-out; }
        .category h2 { 
            font-size: 1.4rem; margin-bottom: 15px; color: #e5e5e5; 
            border-left: 4px solid var(--primary); padding-left: 10px;
        }
        
        .row-container {
            display: flex; overflow-x: auto; padding: 20px 0; gap: 15px;
            scroll-behavior: smooth;
        }
        .row-container::-webkit-scrollbar { display: none; } /* Esconde scroll */

        .card {
            min-width: 160px; height: 240px; border-radius: 8px;
            overflow: hidden; position: relative; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card:hover { 
            transform: scale(1.15) translateY(-10px); 
            z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* --- MODAL ELEGANTE --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-box {
            background: #181818; width: 90%; max-width: 1000px;
            border-radius: 15px; overflow: hidden; position: relative;
            box-shadow: 0 0 50px rgba(229,9,20,0.2);
            transform: translateY(50px); transition: transform 0.3s;
        }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #222; }
        .server-controls { display: flex; gap: 10px; }
        .server-tag { 
            background: #333; padding: 5px 15px; border-radius: 20px; 
            font-size: 12px; cursor: pointer; border: 1px solid #444; 
        }
        .server-tag.active { background: var(--primary); border-color: var(--primary); }
        .close-modal { font-size: 30px; cursor: pointer; color: white; }
        iframe { width: 100%; height: 500px; border: none; background: black; }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .hero-content { top: 20%; left: 5%; width: 90%; }
            iframe { height: 35vh; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="logo" onclick="location.reload()">NETFLIX <span style="font-size: 15px; color: white;">ULTRA</span></div>
        <div class="search-bar">
            <input type="text" placeholder="Buscar título..." onkeyup="buscar(this.value)">
        </div>
    </nav>

    <header class="hero" id="hero">
        <img id="hero-img" class="hero-bg" src="" alt="">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="hero-title">Carregando...</h1>
            <p class="hero-desc" id="hero-desc">Buscando os melhores filmes para você...</p>
            <div style="display: flex; gap: 15px;">
                <button class="btn btn-play" id="btn-hero-play">▶ Assistir Agora</button>
                <button class="btn btn-info">ℹ Mais Info</button>
            </div>
        </div>
    </header>

    <div id="content-area">
        <div class="category"><h2>🔥 Em Alta na Semana</h2><div class="row-container" id="trending"></div></div>
        <div class="category"><h2>🎬 Ação e Aventura</h2><div class="row-container" id="action"></div></div>
        <div class="category"><h2>😂 Comédias</h2><div class="row-container" id="comedy"></div></div>
        <div class="category"><h2>👻 Terror e Suspense</h2><div class="row-container" id="horror"></div></div>
        <div class="category"><h2>👽 Ficção Científica</h2><div class="row-container" id="scifi"></div></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="server-controls">
                    <div class="server-tag active" onclick="setServer(0, this)">Player 1 (Rápido)</div>
                    <div class="server-tag" onclick="setServer(1, this)">Player 2 (Backup)</div>
                    <div class="server-tag" onclick="setServer(2, this)">Player 3 (Alternativo)</div>
                </div>
                <span class="close-modal" onclick="fecharModal()">&times;</span>
            </div>
            <iframe id="player-frame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = 'c3162eed0616407fa43134e07880c7d5';
        const BASE_IMG = 'https://image.tmdb.org/t/p/original';
        const POSTER_IMG = 'https://image.tmdb.org/t/p/w300';
        
        let currentId = '';
        let currentType = 'movie';

        // Inicialização
        window.onload = () => {
            fetchBanner();
            fetchCategory('trending/all/week', 'trending', true);
            fetchCategory('discover/movie?with_genres=28', 'action');
            fetchCategory('discover/movie?with_genres=35', 'comedy');
            fetchCategory('discover/movie?with_genres=27', 'horror');
            fetchCategory('discover/movie?with_genres=878', 'scifi');
        };

        // Carregar Banner Principal
        async function fetchBanner() {
            const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&language=pt-BR`);
            const data = await res.json();
            const filme = data.results[Math.floor(Math.random() * 10)]; // Pega um dos top 10

            document.getElementById('hero-img').src = BASE_IMG + filme.backdrop_path;
            document.getElementById('hero-title').innerText = filme.title || filme.name;
            document.getElementById('hero-desc').innerText = filme.overview || "Sem descrição disponível.";
            
            document.getElementById('btn-hero-play').onclick = () => abrirPlayer(filme.id, filme.media_type || 'movie');
        }

        // Carregar Linhas
        async function fetchCategory(endpoint, elementId, isTrending = false) {
            const res = await fetch(`https://api.themoviedb.org/3/${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=pt-BR`);
            const data = await res.json();
            const container = document.getElementById(elementId);

            data.results.forEach(item => {
                if(!item.poster_path) return;
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => abrirPlayer(item.id, item.media_type || (isTrending ? item.media_type : 'movie'));
                div.innerHTML = `<img src="${POSTER_IMG}${item.poster_path}" alt="${item.title}" loading="lazy">`;
                container.appendChild(div);
            });
        }

        // Sistema de Busca Rápida
        async function buscar(query) {
            if(query.length < 3) return;
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query}&language=pt-BR`);
            const data = await res.json();
            
            const container = document.getElementById('trending');
            container.innerHTML = '';
            document.querySelector('.category h2').innerText = `🔍 Resultados para: ${query}`;
            
            // Esconde outras categorias durante a busca
            document.querySelectorAll('.category').forEach((el, index) => {
                if(index > 0) el.style.display = 'none';
            });

            data.results.forEach(item => {
                if(!item.poster_path) return;
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => abrirPlayer(item.id, item.media_type);
                div.innerHTML = `<img src="${POSTER_IMG}${item.poster_path}">`;
                container.appendChild(div);
            });
        }

        // --- LÓGICA DO PLAYER & SERVIDORES ---
        const servers = [
            (id, type) => `https://vidsrc.me/embed/${type === 'movie' ? 'movie' : 'tv'}?tmdb=${id}`,
            (id, type) => `https://vidsrc.to/embed/${type === 'movie' ? 'movie' : 'tv'}/${id}`,
            (id, type) => `https://multiembed.mov/?video_id=${id}&tmdb=1`
        ];

        function abrirPlayer(id, type) {
            currentId = id;
            currentType = type;
            const modal = document.getElementById('modal');
            const box = document.querySelector('.modal-box');
            
            // Animação de entrada
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'translateY(0)';
            }, 10);

            // Carrega o primeiro servidor
            setServer(0, document.querySelector('.server-tag'));
        }

        function setServer(index, element) {
            // Atualiza visual dos botões
            document.querySelectorAll('.server-tag').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            // Carrega vídeo
            const iframe = document.getElementById('player-frame');
            iframe.src = servers[index](currentId, currentType);
        }

        function fecharModal() {
            const modal = document.getElementById('modal');
            const box = document.querySelector('.modal-box');
            
            modal.style.opacity = '0';
            box.style.transform = 'translateY(50px)';
            
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('player-frame').src = ''; // Para o som
            }, 300);
        }

        // Se o usuário clicar fora do player, fecha também
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                fecharModal();
            }
        }
    </script>
</body>
</html>
