<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream Oficial</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #E50914; --black: #141414; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body { background: #000; color: white; font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* TELA DE LOGIN */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 2000;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=1470&auto=format&fit=crop');
            background-size: cover; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(0,0,0,0.85); padding: 60px; border-radius: 8px; width: 100%; max-width: 450px;
        }
        .login-card h1 { font-family: 'Bebas Neue'; font-size: 50px; margin-bottom: 20px; color: var(--red); }
        .input-field {
            width: 100%; padding: 16px; margin-bottom: 16px; background: #333; border: 1px solid #333; border-radius: 4px; color: white; font-size: 16px;
        }
        .btn-main {
            width: 100%; padding: 16px; background: var(--red); color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px;
        }
        .btn-main:hover { background: #f40612; }
        .toggle-txt { margin-top: 20px; color: #737373; font-size: 14px; cursor: pointer; text-align: center; }
        .toggle-txt span { color: white; text-decoration: underline; }
        .status-msg { color: #ffa00a; margin-bottom: 15px; font-size: 14px; display: none; padding: 10px; border-left: 3px solid #ffa00a; background: rgba(255,160,10,0.1); }

        /* APP PRINCIPAL */
        #app-screen { display: none; }
        
        .nav {
            position: fixed; top: 0; width: 100%; padding: 20px 4%; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 100; transition: 0.3s;
        }
        .nav.black { background: var(--black); }
        .logo { color: var(--red); font-family: 'Bebas Neue'; font-size: 35px; }
        .btn-logout { background: transparent; border: 1px solid white; color: white; padding: 5px 15px; cursor: pointer; }

        /* HERO */
        .hero { height: 85vh; background-size: cover; background-position: center top; position: relative; }
        .hero-content { position: absolute; bottom: 30%; left: 4%; max-width: 600px; text-shadow: 2px 2px 5px black; }
        .hero-title { font-size: 60px; font-family: 'Bebas Neue'; line-height: 1; margin-bottom: 10px; }
        .btn-hero { padding: 12px 30px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }

        /* LISTAS */
        .row { margin-left: 4%; margin-bottom: 40px; }
        .row h2 { color: #e5e5e5; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .posters { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; scrollbar-width: none; }
        .posters::-webkit-scrollbar { display: none; }
        .poster { max-height: 160px; border-radius: 4px; transition: 0.3s; cursor: pointer; }
        .poster:hover { transform: scale(1.1); margin: 0 10px; }
        .poster-large { max-height: 280px; }

        /* PLAYER */
        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 5000; }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 50px; cursor: pointer; z-index: 5001; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-card">
            <h1 id="auth-title">Entrar</h1>
            <p id="status-msg" class="status-msg"></p>
            
            <input type="email" id="email" class="input-field" placeholder="Email ou Gmail">
            <input type="password" id="password" class="input-field" placeholder="Senha">
            
            <button class="btn-main" onclick="handleAuth()" id="auth-btn">Entrar</button>
            
            <div class="toggle-txt" onclick="toggleMode()">
                <span id="toggle-link">Novo por aqui? Assine agora.</span>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <nav class="nav" id="navbar">
            <div class="logo">CINESTREAM</div>
            <div>
                <span id="user-display" style="font-size: 12px; margin-right: 10px;">Usuario</span>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </nav>

        <header class="hero" id="hero">
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">Carregando...</h1>
                <p id="hero-desc">...</p>
                <button class="btn-hero" id="hero-play">▶ Assistir</button>
            </div>
        </header>

        <div style="margin-top: -100px; position: relative; z-index: 10;">
            <div class="row"><h2>Em Alta</h2><div class="posters" id="trending-row"></div></div>
            <div class="row"><h2>Ação</h2><div class="posters" id="action-row"></div></div>
            <div class="row"><h2>Comédia</h2><div class="posters" id="comedy-row"></div></div>
        </div>
    </div>

    <div id="player-modal">
        <span class="close-btn" onclick="closePlayer()">×</span>
        <iframe id="video-frame" allowfullscreen></iframe>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO (Variáveis Únicas) ---
        const URL_BANCO = 'https://jfzgzkurjnznfnlvdghv.supabase.co';
        const CHAVE_BANCO = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmemd6a3Vyam56bmZubHZkZ2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NzI1NjUsImV4cCI6MjA4NTA0ODU2NX0.ntJQabnc1pJvlRwdyldLD7h-60WUN3bgtY2isHrwmDs';
        const TMDB_KEY = 'c3162eed0616407fa43134e07880c7d5';

        // Mudei o nome para 'bancoCine' para evitar o erro de duplicidade
        const bancoCine = window.supabase.createClient(URL_BANCO, CHAVE_BANCO);

        let isLogin = true;

        // --- 2. SISTEMA DE LOGIN ---
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('status-msg');
            const btn = document.getElementById('auth-btn');

            if(!email || !password) {
                msgBox.innerText = "Preencha email e senha.";
                msgBox.style.display = 'block';
                return;
            }

            msgBox.style.display = 'none';
            btn.innerText = "Aguarde...";

            let result;
            if (isLogin) {
                result = await bancoCine.auth.signInWithPassword({ email, password });
            } else {
                result = await bancoCine.auth.signUp({ email, password });
            }

            if (result.error) {
                msgBox.innerText = "Erro: " + result.error.message;
                msgBox.style.display = 'block';
            } else {
                // Se for cadastro e pedir confirmação
                if (!isLogin && result.data.user && !result.data.session) {
                    msgBox.innerText = "Conta criada! Se não entrar, o banco pediu confirmação.";
                    msgBox.style.display = 'block';
                }
            }
            btn.innerText = isLogin ? "Entrar" : "Cadastrar";
        }

        // --- 3. MONITORAMENTO DE ESTADO ---
        bancoCine.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('user-display').innerText = session.user.email;
                carregarFilmes();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        async function logout() {
            await bancoCine.auth.signOut();
            location.reload();
        }

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Entrar" : "Criar Conta";
            document.getElementById('auth-btn').innerText = isLogin ? "Entrar" : "Cadastrar";
            document.getElementById('toggle-link').innerText = isLogin ? "Novo por aqui? Assine agora." : "Já tem conta? Entre aqui.";
        }

        // --- 4. FILMES E PLAYER ---
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_URL = "https://image.tmdb.org/t/p/original";
        const POSTER_URL = "https://image.tmdb.org/t/p/w300";

        async function carregarFilmes() {
            // Banner Hero
            const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${TMDB_KEY}&language=pt-BR`);
            const data = await res.json();
            const hero = data.results[0];

            document.getElementById('hero').style.backgroundImage = `linear-gradient(to top, #000 10%, transparent 90%), url(${IMG_URL}${hero.backdrop_path})`;
            document.getElementById('hero-title').innerText = hero.title || hero.name;
            document.getElementById('hero-desc').innerText = hero.overview.substring(0, 150) + "...";
            document.getElementById('hero-play').onclick = () => abrirPlayer(hero.id, hero.media_type);

            // Listas
            criarLista(`${BASE_URL}/trending/movie/week?api_key=${TMDB_KEY}&language=pt-BR`, 'trending-row', true);
            criarLista(`${BASE_URL}/discover/movie?api_key=${TMDB_KEY}&with_genres=28&language=pt-BR`, 'action-row');
            criarLista(`${BASE_URL}/discover/movie?api_key=${TMDB_KEY}&with_genres=35&language=pt-BR`, 'comedy-row');
        }

        async function criarLista(url, divId, grande = false) {
            const res = await fetch(url);
            const data = await res.json();
            const div = document.getElementById(divId);
            div.innerHTML = ""; // Limpa antes de adicionar
            
            data.results.forEach(f => {
                if(f.poster_path) {
                    div.innerHTML += `<img src="${POSTER_URL}${f.poster_path}" 
                        class="poster ${grande ? 'poster-large' : ''}" 
                        onclick="abrirPlayer(${f.id}, 'movie')">`;
                }
            });
        }

        function abrirPlayer(id, type) {
            const modal = document.getElementById('player-modal');
            const media = type === 'tv' ? 'tv' : 'movie';
            document.getElementById('video-frame').src = `https://vidsrc.me/embed/${media}?tmdb=${id}`;
            modal.style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('video-frame').src = '';
        }

        // Efeito Navbar
        window.onscroll = () => {
            const nav = document.getElementById('navbar');
            if(window.scrollY > 50) nav.classList.add('black');
            else nav.classList.remove('black');
        };
    </script>
</body>
</html>
