<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Verificação Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #E50914; --bg: #0f0f0f; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .container {
            background: rgba(0,0,0,0.85); padding: 40px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 0 50px rgba(229,9,20,0.2); text-align: center;
        }
        h1 { color: var(--primary); margin-bottom: 5px; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 5px;
            border: 1px solid #333; background: #222; color: white; box-sizing: border-box;
        }
        
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 5px; cursor: pointer;
            font-weight: bold; font-size: 16px; margin-top: 10px; transition: 0.3s;
        }
        .btn-login { background: var(--primary); color: white; }
        .btn-login:hover { background: #b20710; }
        
        .btn-signup { background: transparent; border: 1px solid #555; color: #ccc; }
        .btn-signup:hover { border-color: white; color: white; }

        #message-box {
            margin-top: 20px; padding: 15px; border-radius: 5px; font-size: 13px; display: none;
        }
        .success { background: rgba(0, 255, 0, 0.1); color: #4caf50; border: 1px solid #4caf50; }
        .error { background: rgba(255, 0, 0, 0.1); color: #f44336; border: 1px solid #f44336; }

        /* Área Logada */
        #app-area { display: none; text-align: center; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container" id="auth-area">
        <h1>CineStream</h1>
        <p>Acesse ou crie sua conta para assistir</p>

        <input type="email" id="email" placeholder="Seu melhor e-mail">
        <input type="password" id="password" placeholder="Senha segura">

        <button class="btn btn-login" onclick="fazerLogin()">Entrar</button>
        <button class="btn btn-signup" onclick="criarConta()">Criar Conta Nova</button>

        <div id="message-box"></div>
    </div>

    <div class="container" id="app-area" style="background: #1a1a1a;">
        <img src="https://i.pinimg.com/736x/c5/2e/c5/c52ec530a6c6d264f331610e3034e341.jpg" class="avatar">
        <h2>Bem-vindo!</h2>
        <p id="user-email">...</p>
        <div style="background: #333; padding: 10px; border-radius: 5px; margin-bottom: 20px;">
            Status: <span style="color: #4caf50; font-weight: bold;">E-mail Verificado ✅</span>
        </div>
        <button class="btn btn-signup" onclick="sair()">Sair</button>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO COM SUAS CHAVES ---
        const SUPABASE_URL = 'https://jfzgzkurjnznfnlvdghv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_qAm18bsGOiBpLk9H3lsnQQ_WgkBLUa4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. CRIAR CONTA (Dispara o e-mail via SMTP) ---
        async function criarConta() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('message-box');

            if(!email || !password) return mostrarMsg("Preencha e-mail e senha.", "error");

            mostrarMsg("Enviando e-mail de confirmação...", "success");

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                mostrarMsg("Erro: " + error.message, "error");
            } else {
                mostrarMsg(`✅ Sucesso! Um link foi enviado para <b>${email}</b>. Confirme lá no seu Gmail para entrar.`, "success");
            }
        }

        // --- 3. FAZER LOGIN ---
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                mostrarMsg("Erro: " + error.message, "error");
            } else {
                // O observador de estado (onAuthStateChange) vai cuidar da troca de tela
                console.log("Login feito:", data);
            }
        }

        // --- 4. SAIR ---
        async function sair() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        // --- 5. FUNÇÕES DE TELA ---
        function mostrarMsg(texto, tipo) {
            const box = document.getElementById('message-box');
            box.style.display = 'block';
            box.className = tipo;
            box.innerHTML = texto;
        }

        // --- 6. MONITORAR SE TÁ LOGADO ---
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                // Usuário logado
                document.getElementById('auth-area').style.display = 'none';
                document.getElementById('app-area').style.display = 'block';
                document.getElementById('user-email').innerText = session.user.email;
            } else {
                // Ninguém logado
                document.getElementById('auth-area').style.display = 'block';
                document.getElementById('app-area').style.display = 'none';
            }
        });

    </script>
</body>
</html>
