<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #E50914; --black: #141414; --dark-gray: #181818; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body { background: #000; color: white; font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* --- TELA DE LOGIN (COM VÍDEO NO FUNDO OU IMAGEM) --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 2000;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/BR-pt-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(0,0,0,0.85); padding: 60px; border-radius: 10px; width: 100%; max-width: 450px;
        }
        .login-card h1 { font-family: 'Bebas Neue'; font-size: 50px; margin-bottom: 20px; color: var(--red); }
        .input-field {
            width: 100%; padding: 16px; margin-bottom: 16px; background: #333; border: 1px solid #333; border-radius: 4px; color: white; font-size: 16px;
        }
        .input-field:focus { background: #444; border-bottom: 2px solid var(--red); }
        
        .btn-main {
            width: 100%; padding: 16px; background: var(--red); color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-main:hover { background: #f40612; }
        
        .toggle-txt { margin-top: 20px; color: #737373; font-size: 14px; }
        .toggle-txt span { color: white; cursor: pointer; text-decoration: underline; }
        
        .status-msg { color: #ffa00a; margin-bottom: 15px; font-size: 14px; display: none; background: rgba(0,0,0,0.5); padding: 10px; border-left: 3px solid #ffa00a; }

        /* --- APP PRINCIPAL --- */
        #app-screen { display: none; }
        
        /* Navbar Transparente */
        .nav {
            position: fixed; top: 0; width: 100%; padding: 20px 4%; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%); z-index: 100; transition: 0.3s;
        }
        .nav.black { background: var(--black); }
        .logo { color: var(--red); font-family: 'Bebas Neue'; font-size: 35px; cursor: pointer; }
        .user-area { display: flex; align-items: center; gap: 15px; font-size: 13px; }
        .btn-logout { background: transparent; border: 1px solid white; color: white; padding: 5px 15px; cursor: pointer; border-radius: 2px; }

        /* Banner Hero (Destaque) */
        .hero {
            height: 85vh; background-size: cover; background-position: center top; position: relative;
        }
        .hero-shadow {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to top, #000 10%, transparent 90%);
        }
        .hero-content {
            position: absolute; bottom: 35%; left: 4%; max-width: 600px;
        }
        .hero-title { font-size: 60px; font-weight: 800; margin-bottom: 15px; text-shadow: 2px 2px 4px #000; font-family: 'Bebas Neue'; line-height: 0.9; }
        .hero-desc { font-size: 16px; margin-bottom: 20px; text-shadow: 1px 1px 2px #000; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        .btn-hero { padding: 12px 30px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-white { background: white; color: black; }
        .btn-white:hover { opacity: 0.8; }
        .btn-gray { background: rgba(109, 109, 109, 0.7); color: white; margin-left: 10px; }

        /* Categorias de Filmes */
        .row { margin-left: 4%; margin-bottom: 40px; }
        .row h2 { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #e5e5e5; }
        .posters {
            display: flex; overflow-x: scroll; gap: 10px; padding: 10px 0; scrollbar-width: none;
        }
        .posters::-webkit-scrollbar { display: none; }
        
        .poster {
            max-height: 160px; border-radius: 4px; transition: transform 0.3s; cursor: pointer;
        }
        .poster:hover { transform: scale(1.1); margin: 0 10px; opacity: 1; z-index: 50; }
        .poster-large { max-height: 280px; } /* Para Originais */

        /* Player Modal */
        #player-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 5000;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn {
            position: absolute; top: 20px; right: 30px; color: white; font-size: 50px; cursor: pointer; z-index: 5001; text-shadow: 0 2px 5px black;
        }
        .loading-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-card">
            <h1 id="auth-title">Entrar</h1>
            <p id="status-msg" class="status-msg"></p>
            
            <input type="email" id="email" class="input-field" placeholder="Email ou Gmail">
            <input type="password" id="password" class="input-field" placeholder="Senha">
            
            <button class="btn-main" onclick="handleAuth()" id="auth-btn">Entrar</button>
            
            <div class="toggle-txt">
                <span id="toggle-link" onclick="toggleMode()">Novo por aqui? Assine agora.</span>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <nav class="nav" id="navbar">
            <div class="logo">CINESTREAM</div>
            <div class="user-area">
                <span id="user-display">Usuario</span>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </nav>

        <header class="hero" id="hero">
            <div class="hero-shadow"></div>
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">Carregando...</h1>
                <p class="hero-desc" id="hero-desc">...</p>
                <div style="display: flex;">
                    <button class="btn-hero btn-white" id="hero-play">▶ Assistir</button>
                    <button class="btn-hero btn-gray">ℹ Mais Informações</button>
                </div>
            </div>
        </header>

        <div style="margin-top: -150px; position: relative; z-index: 10;">
            <div class="row">
                <h2>Em Alta no CineStream</h2>
                <div class="posters" id="trending-row"></div>
            </div>
            <div class="row">
                <h2>Filmes de Ação</h2>
                <div class="posters" id="action-row"></div>
            </div>
            <div class="row">
                <h2>Comédia</h2>
                <div class="posters" id="comedy-row"></div>
            </div>
             <div class="row">
                <h2>Terror e Suspense</h2>
                <div class="posters" id="horror-row"></div>
            </div>
        </div>
    </div>

    <div id="player-modal">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <div class="loading-text">Carregando Player...</div>
        <iframe id="video-frame" allowfullscreen></iframe>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO (SUAS CHAVES REAIS) ---
        const SUPABASE_URL = 'https://jfzgzkurjnznfnlvdghv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmemd6a3Vyam56bmZubHZkZ2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NzI1NjUsImV4cCI6MjA4NTA0ODU2NX0.ntJQabnc1pJvlRwdyldLD7h-60WUN3bgtY2isHrwmDs';
        const TMDB_KEY = 'c3162eed0616407fa43134e07880c7d5';
        
        // Inicializa Banco
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let isLogin = true; // Controla se é tela de Login ou Cadastro

        // --- 2. SISTEMA DE LOGIN INTELIGENTE ---
        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusBox = document.getElementById('status-msg');
            const btn = document.getElementById('auth-btn');

            statusBox.style.display = 'none';
            btn.innerText = "Processando...";

            let result;

            if (isLogin) {
                // TENTAR LOGIN
                result = await supabase.auth.signInWithPassword({ email, password });
            } else {
                // TENTAR CADASTRO
                result = await supabase.auth.signUp({ email, password });
            }

            if (result.error) {
                statusBox.innerText = "Erro: " + result.error.message;
                statusBox.style.display = 'block';
                btn.innerText = isLogin ? "Entrar" : "Cadastrar";
            } else {
                // SUCESSO
                if (!isLogin) {
                    // Se acabou de cadastrar
                    if (result.data.user && !result.data.session) {
                         statusBox.innerText = "✅ Cadastro feito! Se não entrar automático, verifique seu e-mail.";
                         statusBox.style.display = 'block';
                    } else {
                         // Entrou direto
                         console.log("Cadastro e login automáticos!");
                    }
                }
            }
            btn.innerText = isLogin ? "Entrar" : "Cadastrar";
        }

        // Monitora se o usuário entrou ou saiu
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('user-display').innerText = session.user.email;
                carregarConteudo(); // Carrega os filmes
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "Entrar" : "Criar Conta";
            document.getElementById('auth-btn').innerText = isLogin ? "Entrar" : "Cadastrar";
            document.getElementById('toggle-link').innerText = isLogin ? "Novo por aqui? Assine agora." : "Já tem conta? Entre aqui.";
        }

        // --- 3. SISTEMA DE FILMES (API TMDB) ---
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_URL = "https://image.tmdb.org/t/p/original";
        const CARD_URL = "https://image.tmdb.org/t/p/w300";

        async function carregarConteudo() {
            // 1. Carregar Banner (Hero)
            const resHero = await fetch(`${BASE_URL}/trending/all/week?api_key=${TMDB_KEY}&language=pt-BR`);
            const dataHero = await resHero.json();
            const filmeHero = dataHero.results[0]; // Pega o Top 1

            document.getElementById('hero').style.backgroundImage = `url(${IMG_URL}${filmeHero.backdrop_path})`;
            document.getElementById('hero-title').innerText = filmeHero.title || filmeHero.name;
            document.getElementById('hero-desc').innerText = filmeHero.overview;
            
            // Configura botão assistir do Banner
            document.getElementById('hero-play').onclick = () => abrirPlayer(filmeHero.id, filmeHero.media_type);

            // 2. Carregar Listas (Carrosseis)
            criarLista(`${BASE_URL}/trending/movie/week?api_key=${TMDB_KEY}&language=pt-BR`, 'trending-row', true);
            criarLista(`${BASE_URL}/discover/movie?api_key=${TMDB_KEY}&with_genres=28&language=pt-BR`, 'action-row');
            criarLista(`${BASE_URL}/discover/movie?api_key=${TMDB_KEY}&with_genres=35&language=pt-BR`, 'comedy-row');
            criarLista(`${BASE_URL}/discover/movie?api_key=${TMDB_KEY}&with_genres=27&language=pt-BR`, 'horror-row');
        }

        async function criarLista(url, elementoId, isLarge = false) {
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById(elementoId);

            data.results.forEach(filme => {
                if(!filme.poster_path) return; // Só mostra se tiver capa
                
                const img = document.createElement('img');
                img.className = `poster ${isLarge ? 'poster-large' : ''}`;
                img.src = `${CARD_URL}${filme.poster_path}`;
                img.onclick = () => abrirPlayer(filme.id, 'movie'); // Clicou, abriu player
                
                container.appendChild(img);
            });
        }

        // --- 4. PLAYER DE VÍDEO ---
        function abrirPlayer(id, type) {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            const mediaType = type === 'tv' ? 'tv' : 'movie'; // Garante o tipo certo

            // Indexador de vídeo (Vidsrc)
            iframe.src = `https://vidsrc.me/embed/${mediaType}?tmdb=${id}`;
            modal.style.display = 'block';
        }

        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            iframe.src = ''; // Para o som
            modal.style.display = 'none';
        }

        // Navbar fica preta ao rolar
        window.addEventListener("scroll", () => {
            const nav = document.getElementById("navbar");
            if (window.scrollY > 100) nav.classList.add("black");
            else nav.classList.remove("black");
        });

    </script>
</body>
</html>
