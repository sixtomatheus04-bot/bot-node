<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Login & Assinatura</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #E50914; --black: #0a0a0a; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--black); color: white; font-family: 'Outfit', sans-serif; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 8px; background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--red); }

        /* --- TELA DE LOGIN --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 2000;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.9)), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d08737b/BR-pt-20220502-popsignuptwoweeks-perspective_alpha_website_medium.jpg');
            background-size: cover; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(0,0,0,0.85); padding: 50px; border-radius: 8px; width: 100%; max-width: 400px;
        }
        .login-title { font-family: 'Bebas Neue'; font-size: 40px; margin-bottom: 20px; color: var(--red); }
        .input-group { margin-bottom: 15px; }
        .input-group input {
            width: 100%; padding: 15px; background: #333; border: 1px solid #444; border-radius: 4px; color: white; font-size: 16px;
        }
        .btn-auth {
            width: 100%; padding: 15px; background: var(--red); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; transition: 0.3s;
        }
        .btn-auth:hover { background: #f40612; }
        .switch-txt { margin-top: 15px; font-size: 14px; color: #aaa; cursor: pointer; }
        .switch-txt span { color: white; text-decoration: underline; }
        .error-msg { color: #ffbaba; background: rgba(255,0,0,0.2); padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 14px; border: 1px solid var(--red); }

        /* --- NAVBAR --- */
        .nav {
            position: fixed; top: 0; width: 100%; height: 70px; padding: 0 4%; display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent); z-index: 100; transition: 0.4s;
        }
        .nav.black { background: #000; border-bottom: 1px solid #222; }
        
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo { color: var(--red); font-family: 'Bebas Neue'; font-size: 30px; cursor: pointer; }
        
        .user-menu { display: flex; align-items: center; gap: 15px; }
        .vip-tag { background: #E5B80B; color: black; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: none; }
        .btn-logout { background: transparent; border: 1px solid #666; color: white; padding: 5px 10px; cursor: pointer; font-size: 12px; }

        /* --- HERO & APP --- */
        #app-screen { display: none; } /* Começa escondido */
        .hero { height: 95vh; background-size: cover; background-position: center top; position: relative; }
        .hero-content { position: absolute; bottom: 25%; left: 4%; max-width: 600px; text-shadow: 2px 2px 10px black; }
        .hero-title { font-size: 60px; font-family: 'Bebas Neue'; line-height: 0.9; margin-bottom: 20px; }
        .btn { padding: 10px 25px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; margin-right: 10px; }
        .btn-white { background: white; color: black; }
        
        /* LISTAS */
        .row { margin-left: 4%; margin-bottom: 40px; }
        .row h2 { color: #e5e5e5; font-size: 18px; font-weight: bold; margin-bottom: 10px; border-left: 4px solid var(--red); padding-left: 10px; }
        .posters { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; scrollbar-width: none; }
        .poster { max-height: 160px; border-radius: 4px; transition: 0.3s; cursor: pointer; }
        .poster:hover { transform: scale(1.1); margin: 0 10px; }

        /* MODAL DE PAGAMENTO (SIMULAÇÃO) */
        #paywall-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 6000; align-items: center; justify-content: center;
        }
        .paywall-box { background: #141414; padding: 40px; text-align: center; border-radius: 10px; border: 1px solid var(--red); max-width: 500px; }
        .paywall-box h2 { color: var(--red); font-size: 30px; margin-bottom: 10px; }
        .paywall-box ul { text-align: left; margin: 20px 0; color: #ccc; }
        .btn-pay { width: 100%; padding: 15px; background: #E5B80B; color: black; font-weight: bold; border: none; cursor: pointer; font-size: 18px; margin-top: 10px; }

        /* PLAYER */
        #video-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 5000; }
        iframe { width: 100%; height: 100%; border: none; }
        .close-video { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px; cursor: pointer; z-index: 5001; }

    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-card">
            <h1 class="login-title" id="auth-title">Entrar</h1>
            <div id="error-box" class="error-msg"></div>
            
            <div class="input-group">
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha">
            </div>
            
            <button class="btn-auth" onclick="processarAuth()" id="btn-action">Entrar</button>
            
            <div class="switch-txt" onclick="alternarModo()">
                <span id="switch-text">Novo por aqui? Assine agora.</span>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <nav class="nav" id="navbar">
            <div class="nav-left">
                <div class="logo">CINESTREAM</div>
            </div>
            <div class="user-menu">
                <div class="vip-tag" id="vip-badge">PREMIUM</div>
                <div style="font-size: 13px;" id="user-email-display">usuario@email.com</div>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </nav>

        <header class="hero" id="hero">
            <div class="hero-content">
                <h1 class="hero-title" id="hero-title">Carregando...</h1>
                <p class="hero-desc" id="hero-desc">...</p>
                <button class="btn btn-white" id="hero-btn">▶ Assistir</button>
            </div>
        </header>

        <div style="margin-top: -100px; position: relative; z-index: 10;">
            <div class="row"><h2>🔥 Em Alta</h2><div class="posters" id="row-trend"></div></div>
            <div class="row"><h2>🎬 Ação</h2><div class="posters" id="row-action"></div></div>
            <div class="row"><h2>😂 Comédia</h2><div class="posters" id="row-comedy"></div></div>
        </div>
    </div>

    <div id="paywall-modal">
        <div class="paywall-box">
            <h2>Seja Premium 👑</h2>
            <p>Este conteúdo é exclusivo para assinantes.</p>
            <ul>
                <li>✅ Acesso ilimitado a filmes e séries</li>
                <li>✅ Sem anúncios</li>
                <li>✅ Qualidade 4K</li>
            </ul>
            <button class="btn-pay" onclick="assinarPremium()">ASSINAR AGORA (Simular)</button>
            <p style="margin-top: 15px; font-size: 12px; cursor: pointer; color: #888;" onclick="fecharPaywall()">Voltar</p>
        </div>
    </div>

    <div id="video-overlay">
        <span class="close-video" onclick="fecharVideo()">×</span>
        <iframe id="video-frame" allowfullscreen></iframe>
    </div>

    <script>
        // CONFIGURAÇÃO
        const API_KEY = 'c3162eed0616407fa43134e07880c7d5';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/original';
        const POSTER_URL = 'https://image.tmdb.org/t/p/w300';

        // VARIÁVEIS DO SISTEMA
        let isLoginMode = true;
        let currentUser = null; // Guarda o usuário logado

        // --- SISTEMA DE BANCO DE DADOS (LOCALSTORAGE) ---
        
        function getUsersDB() {
            // Pega a lista de usuários do navegador
            const users = localStorage.getItem('cine_users_db');
            return users ? JSON.parse(users) : [];
        }

        function saveUserDB(users) {
            localStorage.setItem('cine_users_db', JSON.stringify(users));
        }

        function processarAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('error-box');
            
            errorBox.style.display = 'none';

            if (!email || !pass) {
                showError("Preencha todos os campos.");
                return;
            }

            const users = getUsersDB();

            if (isLoginMode) {
                // --- LOGIN ---
                const user = users.find(u => u.email === email && u.pass === pass);
                if (user) {
                    loginSuccess(user);
                } else {
                    showError("Email ou senha incorretos.");
                }
            } else {
                // --- CADASTRO ---
                const existing = users.find(u => u.email === email);
                if (existing) {
                    showError("Este email já está cadastrado.");
                } else {
                    const newUser = { 
                        email: email, 
                        pass: pass, 
                        plan: 'free' // Todo mundo começa Grátis
                    };
                    users.push(newUser);
                    saveUserDB(users);
                    alert("Conta criada com sucesso! Faça login.");
                    alternarModo(); // Vai para a tela de login
                }
            }
        }

        function loginSuccess(user) {
            currentUser = user;
            // Salva sessão
            localStorage.setItem('cine_current_user', JSON.stringify(user));
            
            // Atualiza Interface
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('user-email-display').innerText = user.email;
            
            atualizarBadge();
            carregarFilmes();
        }

        function atualizarBadge() {
            const badge = document.getElementById('vip-badge');
            if (currentUser.plan === 'premium') {
                badge.style.display = 'block';
                badge.innerText = "PREMIUM";
                badge.style.background = "#E5B80B";
            } else {
                badge.style.display = 'block';
                badge.innerText = "GRÁTIS";
                badge.style.background = "#666";
            }
        }

        function logout() {
            localStorage.removeItem('cine_current_user');
            location.reload();
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.innerText = msg;
            box.style.display = 'block';
        }

        function alternarModo() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Entrar" : "Criar Conta";
            document.getElementById('btn-action').innerText = isLoginMode ? "Entrar" : "Cadastrar";
            document.getElementById('switch-text').innerText = isLoginMode ? "Novo por aqui? Assine agora." : "Já tem conta? Entre aqui.";
            document.getElementById('error-box').style.display = 'none';
        }

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            // Verifica se já estava logado
            const saved = localStorage.getItem('cine_current_user');
            if (saved) {
                // Recarrega dados atualizados do banco (para ver se assinou)
                const savedUser = JSON.parse(saved);
                const db = getUsersDB();
                const freshUser = db.find(u => u.email === savedUser.email);
                
                if (freshUser) {
                    loginSuccess(freshUser);
                } else {
                    localStorage.removeItem('cine_current_user'); // Usuário foi deletado
                }
            }
        };

        // --- LÓGICA DE PAGAMENTO / ASSINATURA ---
        
        function verificarPermissao(filmeId) {
            // Se for premium, libera tudo
            if (currentUser.plan === 'premium') {
                abrirPlayer(filmeId);
            } else {
                // Se for grátis, mostra o Paywall
                document.getElementById('paywall-modal').style.display = 'flex';
            }
        }

        function assinarPremium() {
            // 1. Atualiza no banco de dados local
            const users = getUsersDB();
            const myIndex = users.findIndex(u => u.email === currentUser.email);
            
            if (myIndex !== -1) {
                users[myIndex].plan = 'premium';
                saveUserDB(users);
                
                // 2. Atualiza usuário atual
                currentUser.plan = 'premium';
                localStorage.setItem('cine_current_user', JSON.stringify(currentUser));
                
                // 3. Feedback
                alert("Pagamento aprovado! Você agora é Premium.");
                fecharPaywall();
                atualizarBadge();
            }
        }

        function fecharPaywall() {
            document.getElementById('paywall-modal').style.display = 'none';
        }

        // --- SISTEMA DE FILMES (API) ---

        async function carregarFilmes() {
            // Hero
            const res = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}&language=pt-BR`);
            const data = await res.json();
            const hero = data.results[0];
            document.getElementById('hero').style.backgroundImage = `url(${IMG_URL}${hero.backdrop_path})`;
            document.getElementById('hero-title').innerText = hero.title;
            document.getElementById('hero-desc').innerText = hero.overview;
            document.getElementById('hero-btn').onclick = () => verificarPermissao(hero.id);

            // Listas
            loadList(`${BASE_URL}/trending/movie/week?api_key=${API_KEY}&language=pt-BR`, 'row-trend');
            loadList(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=28&language=pt-BR`, 'row-action');
            loadList(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=35&language=pt-BR`, 'row-comedy');
        }

        async function loadList(url, elId) {
            const res = await fetch(url);
            const data = await res.json();
            const el = document.getElementById(elId);
            data.results.forEach(f => {
                if(f.poster_path) {
                    el.innerHTML += `<img src="${POSTER_URL}${f.poster_path}" class="poster" onclick="verificarPermissao(${f.id})">`;
                }
            });
        }

        // PLAYER
        function abrirPlayer(id) {
            document.getElementById('video-overlay').style.display = 'block';
            document.getElementById('video-frame').src = `https://vidsrc.me/embed/movie?tmdb=${id}`;
        }
        function fecharVideo() {
            document.getElementById('video-overlay').style.display = 'none';
            document.getElementById('video-frame').src = '';
        }
        
        // Scroll Nav
        window.onscroll = () => {
            const n = document.getElementById('navbar');
            window.scrollY > 50 ? n.classList.add('black') : n.classList.remove('black');
        };

    </script>
</body>
</html>
