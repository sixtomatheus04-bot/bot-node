<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Salvar no Banco de Dados (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .caixa { background: #222; padding: 40px; border-radius: 10px; width: 300px; text-align: center; border: 1px solid #444; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #333; border: 1px solid #555; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #00C851; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #007E33; }
        #status { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="caixa">
        <h2>Banco de Dados</h2>
        <p>Salvar Usuário</p>
        
        <input type="email" id="email" placeholder="Digite o Gmail">
        <input type="password" id="senha" placeholder="Digite a Senha">
        
        <button onclick="salvarUsuario()">SALVAR NO BANCO</button>
        
        <p id="status"></p>
    </div>

    <script>
        // 2. SUAS CHAVES DO BANCO DE DADOS (JÁ CONFIGURADAS)
        const PROJETO_URL = 'https://jfzgzkurjnznfnlvdghv.supabase.co';
        const CHAVE_PUBLICA = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmemd6a3Vyam56bmZubHZkZ2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NzI1NjUsImV4cCI6MjA4NTA0ODU2NX0.ntJQabnc1pJvlRwdyldLD7h-60WUN3bgtY2isHrwmDs';
        
        // Inicializa a conexão
        const banco = window.supabase.createClient(PROJETO_URL, CHAVE_PUBLICA);

        async function salvarUsuario() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('senha').value;
            const status = document.getElementById('status');

            status.innerText = "Conectando ao banco...";
            status.style.color = "yellow";

            // 3. COMANDO PARA SALVAR
            // Tenta criar o usuário (SignUp)
            const { data, error } = await banco.auth.signUp({
                email: email,
                password: password
            });

            // 4. VERIFICA O RESULTADO
            if (error) {
                // Se deu erro (ex: senha curta, conexão falhou)
                status.innerText = "ERRO: " + error.message;
                status.style.color = "red";
            } else {
                // Se salvou com sucesso
                if (data.user && !data.session) {
                    status.innerText = "⚠️ Salvo! Mas o banco pede confirmação de e-mail (Verifique o painel).";
                    status.style.color = "orange";
                } else {
                    status.innerText = "✅ SUCESSO! Usuário salvo e logado.";
                    status.style.color = "#00C851";
                    console.log("Dados do usuário:", data);
                }
            }
        }
    </script>
</body>
</html>
